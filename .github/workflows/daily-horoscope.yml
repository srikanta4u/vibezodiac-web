name: Daily Horoscope + Newsletter

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:

jobs:
  generate-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Node dependencies
        run: npm ci

      - name: Generate daily horoscopes
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          HTTP_STATUS=$(curl -s -o response.txt -w "%{http_code}" -X POST \
            "https://ywovuuomfblorpdwbyks.supabase.co/functions/v1/generate-daily-horoscopes" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"source":"github-actions"}')
          echo "Horoscope status: $HTTP_STATUS"
          cat response.txt
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Horoscope generation failed with status $HTTP_STATUS"
            exit 1
          fi

      - name: Wait for horoscopes to save
        run: sleep 45

      - name: Embed horoscopes into vector DB
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ywovuuomfblorpdwbyks.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/ingest.mjs

      - name: Send daily newsletter
        env:
          ZOHO_EMAIL: ${{ secrets.ZOHO_EMAIL }}
          ZOHO_PASSWORD: ${{ secrets.ZOHO_PASSWORD }}
          SUPABASE_URL: https://ywovuuomfblorpdwbyks.supabase.co
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 scripts/send_newsletter.py --auto
